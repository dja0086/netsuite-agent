<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Builder</title>
<style>
  /* Design: Project Tracker UI/UX packet, minimal v3 (design-tokens.json). */
  :root {
    --canvas: #ffffff; --rail: #f5f5f3; --surface: #ffffff; --ink: #202120; --secondary: #666962;
    --border: #e3e4e0; --control: #858a82; --selected: #e9eae5; --action: #242624; --action-ink: #ffffff;
    --soft: #f5f5f3; --bad: #a3271f;
    --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --r-card: 18px; --r-button: 12px; --r-input: 8px; --r-composer: 22px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--canvas); color: var(--ink); font: 400 16px/24px var(--font); }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { button, .card { transition: background-color 120ms, border-color 120ms; } }

  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  .rail { background: var(--rail); border-right: 1px solid var(--border); padding: 24px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .brand { font-size: 20px; line-height: 28px; font-weight: 600; padding: 0 14px; }
  .scope { font-size: 13px; line-height: 18px; color: var(--secondary); padding: 6px 14px 24px; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav a { display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; color: var(--ink); text-decoration: none; }
  .nav a:hover { background: var(--selected); }
  .nav a[aria-current="page"] { background: var(--selected); }
  .count { font-size: 13px; color: var(--secondary); }
  .rail hr { border: 0; border-top: 1px solid var(--border); margin: 16px 14px; }
  .rail .bottom { margin-top: auto; }

  .main { display: flex; flex-direction: column; min-width: 0; }
  header { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 40px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--canvas); z-index: 2; }
  .crumbs { font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs a { color: var(--ink); text-decoration: none; }
  .crumbs .sep { color: var(--secondary); margin: 0 8px; }
  .hmeta { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--secondary); white-space: nowrap; }
  .hmeta .bar { width: 1px; height: 24px; background: var(--border); }
  .content { padding: 32px 40px 40px; display: flex; flex-direction: column; gap: 16px; max-width: 1240px; width: 100%; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 24px; }
  .work { min-height: 128px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .work .text { min-width: 0; }
  .meta { font-size: 13px; line-height: 18px; color: var(--secondary); }
  .title { font-size: 18px; line-height: 26px; font-weight: 500; margin: 4px 0 2px; overflow-wrap: anywhere; }
  .reason { color: var(--secondary); }
  .links { display: flex; gap: 16px; margin-top: 8px; font-size: 14px; }
  .links button { background: none; border: 0; padding: 0; min-height: 24px; color: var(--secondary); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .links button:hover { color: var(--ink); }

  .btn { min-height: 44px; padding: 0 20px; border-radius: var(--r-button); border: 1px solid var(--control); background: var(--surface); font-size: 14px; line-height: 20px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .btn.primary { background: var(--action); color: var(--action-ink); border-color: var(--action); }
  .btn:disabled { background: var(--selected); color: var(--secondary); border-color: var(--selected); cursor: progress; }

  .composer { display: flex; gap: 12px; align-items: flex-end; border: 1px solid var(--border); border-radius: var(--r-composer); padding: 12px 12px 12px 20px; min-height: 72px; background: var(--surface); }
  .composer textarea { flex: 1; border: 0; resize: none; outline: none; padding: 10px 0; min-height: 44px; max-height: 200px; background: transparent; }
  .composer textarea::placeholder { color: var(--secondary); }

  .split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
  .session { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
  .field { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; align-items: start; padding: 8px 0; }
  .field > label, .field > .k { color: var(--secondary); padding-top: 10px; font-size: 14px; }
  input[type=text], select, .field textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--control); border-radius: var(--r-input); background: var(--surface); }
  .field textarea { min-height: 260px; resize: vertical; font-size: 14px; line-height: 21px; }
  .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 2px 16px; padding-top: 8px; }
  .checks label { display: flex; align-items: center; gap: 8px; min-height: 32px; font-family: var(--mono); font-size: 13px; }
  .checks input { width: 18px; height: 18px; accent-color: var(--action); }
  .foot { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }
  .quiet { font-size: 13px; color: var(--secondary); }
  .problems { margin: 8px 0 0; padding-left: 20px; color: var(--bad); }
  .questions { margin: 8px 0 0; padding-left: 20px; color: var(--secondary); }

  .bubble { background: var(--soft); border-radius: 14px; padding: 14px 18px; white-space: pre-wrap; }
  .said { white-space: pre-wrap; }
  .step { font-size: 13px; line-height: 18px; color: var(--secondary); }
  .step summary { cursor: pointer; list-style: none; }
  .step summary::-webkit-details-marker { display: none; }
  .step summary::before { content: "▸ "; } .step[open] summary::before { content: "▾ "; }
  .step pre, .exact pre { white-space: pre-wrap; word-break: break-word; font: 12px/18px var(--mono); background: var(--soft); border-radius: 8px; padding: 10px 12px; margin: 6px 0 0; max-height: 280px; overflow: auto; color: var(--ink); }
  .log { display: flex; flex-direction: column; gap: 16px; }
  .pill { display: inline-block; padding: 4px 12px; border-radius: 8px; background: var(--selected); font-size: 14px; font-weight: 500; }
  .approval { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; margin-top: 16px; }
  .approval .left { border-right: 1px solid var(--border); padding-right: 24px; }
  .kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 16px; align-content: start; }
  .kv .k { color: var(--secondary); }
  .kv .v { overflow-wrap: anywhere; }
  .side .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
  .side .file { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
  .empty { color: var(--secondary); }
  .error { color: var(--bad); font-size: 14px; }
  [hidden] { display: none !important; }

  /* Flux. Impact colours pass the palette validator's colour-blind checks; a sign and a word always carry the same meaning. */
  :root { --fav: #00909f; --unfav: #c4432f; --neutral: #a8aba4; --warn-soft: #faf3e6; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .muted { color: var(--secondary); }
  .bad-text { color: var(--bad); }
  .fx-form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .fx-form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--secondary); min-width: 160px; }
  .fx-form label input, .fx-form label select { color: var(--ink); font-size: 14px; }
  .fx-grow { flex: 1; }
  .fx-quick { display: flex; gap: 16px; margin-top: 8px; }
  .fx-quick button { background: none; border: 0; padding: 0; font-size: 13px; color: var(--secondary); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .fx-pack { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--border); color: var(--ink); text-decoration: none; flex-wrap: wrap; }
  .fx-pack:hover b { text-decoration: underline; }
  .fx-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; flex-wrap: wrap; }
  .fx-headline { font-size: 28px; line-height: 36px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .quiet-big { font-size: 18px; font-weight: 400; color: var(--secondary); }
  .fx-progressline { color: var(--secondary); font-size: 14px; margin-top: 4px; }
  .fx-progressline b { color: var(--ink); }
  .fx-actions { display: flex; gap: 8px; }
  .fx-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .fx-chip { font-size: 12px; line-height: 16px; padding: 4px 10px; border-radius: 8px; background: var(--soft); color: var(--secondary); }
  .fx-chip.bad { background: var(--warn-soft); color: var(--bad); }
  .fx-who { margin-left: auto; font-size: 12px; color: var(--secondary); display: flex; align-items: center; gap: 6px; }
  .fx-who input { width: 130px; min-height: 28px; padding: 2px 8px; font-size: 12px; }
  .fx-note { margin-top: -4px; }
  .fx-card { padding: 20px 24px; }
  .fx-table-card { padding: 12px 0 0; overflow: hidden; }
  .fx-table-card .fx-tabs { padding: 0 24px; }
  .fx-progress { display: flex; justify-content: space-between; gap: 16px; padding: 12px 24px; flex-wrap: wrap; background: var(--soft); border: 0; }
  .fx-section-title { font-size: 15px; line-height: 22px; font-weight: 500; }
  .fx-section-title.small { font-size: 13px; margin-top: 16px; }
  .fx-legend { display: flex; gap: 16px; font-size: 12px; color: var(--secondary); margin: 2px 0 10px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .swatch.fav, .fx-wbar.fav, .fx-dfill.fav { background: var(--fav); }
  .swatch.unfav, .fx-wbar.unfav, .fx-dfill.unfav { background: var(--unfav); }
  .fx-dfill.neutral, .fx-wbar.neutral { background: var(--neutral); }
  .fx-waterfall { display: flex; flex-direction: column; gap: 2px; }
  .fx-wrow { display: grid; grid-template-columns: minmax(120px, 280px) minmax(0, 1fr) 118px; gap: 12px; align-items: center; min-height: 24px; width: 100%; padding: 1px 6px; border: 0; border-radius: 6px; background: none; font-size: 13px; text-align: left; }
  button.fx-wrow { cursor: pointer; }
  button.fx-wrow:hover { background: var(--soft); }
  .fx-wrow.total { font-weight: 500; }
  .fx-wlabel { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fx-wtrack { position: relative; height: 16px; }
  .fx-wbar { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .fx-wbar.base { background: var(--control); }
  .fx-wvalue { text-align: right; font-variant-numeric: tabular-nums; }
  .fx-tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .fx-tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px; font-size: 14px; cursor: pointer; color: var(--secondary); margin-bottom: -1px; }
  .fx-tab[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--action); font-weight: 500; }
  .fx-scroll { overflow-x: auto; }
  .fx-table { border-collapse: collapse; width: 100%; font-size: 13px; line-height: 18px; }
  .fx-table th { position: sticky; top: 0; background: var(--canvas); text-align: left; font-weight: 500; color: var(--secondary); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .fx-table th.num { text-align: right; }
  .fx-table td { padding: 7px 10px; border-bottom: 1px solid var(--soft); vertical-align: middle; }
  .fx-table th:first-child, .fx-table td:first-child { padding-left: 24px; }
  .fx-table th:last-child, .fx-table td:last-child { padding-right: 24px; }
  .fx-table tbody tr[data-open] { cursor: pointer; }
  .fx-table tbody tr[data-open]:hover, .fx-table tr.selected { background: var(--soft); }
  .fx-acct { min-width: 180px; }
  .fx-delta { display: grid; grid-template-columns: 130px 104px; gap: 8px; align-items: center; justify-content: end; }
  .fx-dbar { position: relative; display: block; height: 12px; background: linear-gradient(var(--border), var(--border)) center / 1px 100% no-repeat; }
  .fx-dbar.small { height: 10px; }
  .fx-dfill { position: absolute; top: 0; bottom: 0; border-radius: 2px; min-width: 1px; }
  .fx-ev { white-space: nowrap; }
  .fx-meter { display: inline-block; width: 44px; height: 6px; border-radius: 3px; background: var(--selected); overflow: hidden; vertical-align: 1px; margin-right: 6px; }
  .fx-meter.wide { display: block; width: 100%; margin: 4px 0 0; height: 8px; border-radius: 4px; }
  .fx-meter i { display: block; height: 100%; background: var(--ink); }
  .fx-meter i.partly_traced { background: var(--control); }
  .fx-meter i.insufficient { background: var(--unfav); }
  .fx-state { display: inline-block; font-size: 12px; line-height: 16px; padding: 2px 8px; border-radius: 6px; white-space: nowrap; background: var(--selected); }
  .fx-state.below, .fx-state.noev { background: none; color: var(--secondary); padding-left: 0; }
  .fx-state.approved { background: var(--ink); color: var(--action-ink); }
  .fx-state.sent, .fx-state.stale { background: var(--warn-soft); color: var(--bad); }
  .fx-sub td { font-weight: 500; background: var(--soft); }
  .fx-residual td { color: var(--secondary); padding-top: 12px; padding-bottom: 12px; }
  .fx-residual button { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .fx-policy { font-size: 14px; color: var(--secondary); }
  .fx-policy summary { cursor: pointer; }
  .fx-policy.inner { margin-top: 16px; }
  .fx-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100vw); background: var(--canvas); border-left: 1px solid var(--border); box-shadow: -12px 0 32px rgba(32, 33, 32, 0.08); overflow-y: auto; padding: 20px 24px 40px; z-index: 5; display: flex; flex-direction: column; gap: 12px; }
  .fx-dhead { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
  .fx-dhead-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .fx-close { background: none; border: 0; font-size: 24px; line-height: 24px; width: 32px; height: 32px; cursor: pointer; color: var(--secondary); }
  .fx-figures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .fx-fig { font-size: 18px; line-height: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .fx-fig.muted { font-weight: 400; }
  .fx-whatif { line-height: 19px; }
  .fx-trend { display: flex; align-items: flex-end; gap: 8px; height: 92px; }
  .fx-tcol { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .fx-tval { font-size: 11px; line-height: 14px; color: var(--secondary); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .fx-tbar { width: 100%; max-width: 44px; background: var(--selected); border-radius: 3px 3px 0 0; }
  .fx-tbar.cur { background: var(--ink); }
  .fx-tbar.prior { background: var(--control); }
  .fx-tname { font-size: 11px; line-height: 16px; color: var(--secondary); }
  .fx-tabbody { display: flex; flex-direction: column; gap: 12px; font-size: 14px; line-height: 21px; padding-top: 4px; }
  .fx-tabbody p { margin: 0; }
  .fx-alert { background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 19px; }
  .fx-covline { display: flex; justify-content: space-between; gap: 12px; }
  .fx-drivers { display: flex; flex-direction: column; border-top: 1px solid var(--border); }
  .fx-driver { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
  .fx-driver.remainder { color: var(--secondary); }
  .fx-driver.remainder b { font-weight: 500; }
  .fx-drow { display: flex; justify-content: space-between; gap: 16px; }
  .fx-cites { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .fx-cause { font-size: 12px; line-height: 16px; color: var(--secondary); }
  .fx-cause.unknown { color: var(--bad); }
  .fx-cite { font-size: 12px; line-height: 16px; padding: 2px 8px; border-radius: 6px; background: var(--soft); color: var(--ink); text-decoration: none; }
  .fx-cite:hover { background: var(--selected); }
  .fx-question, .fx-prior { border-radius: 10px; padding: 10px 14px; background: var(--soft); }
  .fx-write { display: flex; flex-direction: column; gap: 6px; }
  .fx-write textarea { width: 100%; min-height: 96px; resize: vertical; padding: 10px 12px; border: 1px solid var(--control); border-radius: var(--r-input); font-size: 14px; line-height: 21px; background: var(--surface); }
  .fx-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fx-row input { flex: 1; min-width: 180px; }
  .fx-signoff { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; }
  .fx-chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
  .fx-chipbtn { font-size: 13px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
  .fx-chipbtn[aria-pressed="true"] { background: var(--selected); border-color: var(--selected); font-weight: 500; }
  .fx-callout { background: var(--soft); border-radius: 10px; padding: 10px 14px; }
  .fx-dimlist { display: flex; flex-direction: column; }
  .fx-dimrow { display: grid; grid-template-columns: minmax(0, 1fr) 100px 96px 52px; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--soft); font-size: 13px; }
  .fx-dimname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fx-txn { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--soft); color: var(--ink); text-decoration: none; font-size: 13px; line-height: 19px; }
  .fx-txn:hover b { text-decoration: underline; }
  .fx-txnmain { display: flex; flex-direction: column; min-width: 0; }
  .fx-txnmain b { font-weight: 500; }
  .fx-memo { color: var(--secondary); overflow-wrap: anywhere; }
  .fx-memo.none { color: var(--control); }
  .fx-hist { padding: 8px 0; border-bottom: 1px solid var(--soft); font-size: 13px; line-height: 19px; }
  @media (max-width: 1279px) {
    .fx-delta { grid-template-columns: 56px 92px; gap: 6px; }
    .fx-table th, .fx-table td { padding-left: 6px; padding-right: 6px; }
    .fx-table th:first-child, .fx-table td:first-child { padding-left: 16px; }
    .fx-table th:last-child, .fx-table td:last-child { padding-right: 16px; }
    .fx-acct { min-width: 130px; }
    .fx-meter { width: 24px; margin-right: 4px; }
    .fx-wrow { grid-template-columns: minmax(100px, 200px) minmax(0, 1fr) 100px; }
  }
  @media print { .rail, header, .fx-actions, .fx-drawer, .fx-policy { display: none !important; } .shell { display: block; } }

  @media (max-width: 1279px) { .session { grid-template-columns: 1fr; } }
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .rail { position: static; height: auto; padding: 12px 20px; }
    .brand, .scope { padding-left: 0; padding-right: 0; } .scope { padding-bottom: 8px; }
    .nav a { min-height: 44px; padding: 0 12px; }
    .nav { flex-direction: row; flex-wrap: wrap; } .rail .bottom { margin-top: 0; } .rail hr { display: none; }
    header { padding: 0 20px; } .content { padding: 20px; }
    .work { flex-direction: column; align-items: stretch; } .split, .approval { grid-template-columns: 1fr; }
    .approval .left { border-right: 0; padding-right: 0; } .field { grid-template-columns: 1fr; } .field > label { padding-top: 0; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Agent Builder">
    <div class="brand">Agent Builder</div>
    <div class="scope">TSTDRV1755417 · NetSuite demo</div>
    <div class="nav">
      <a href="#/" data-nav="home">For you <span class="count" id="needCount"></span></a>
      <a href="#/agents" data-nav="agents">Agents</a>
      <a href="#/runs" data-nav="runs">Runs</a>
      <a href="#/schedules" data-nav="schedules">Schedules</a>
      <a href="#/flux" data-nav="flux">Flux</a>
    </div>
    <hr>
    <div class="nav bottom">
      <a href="#/rules" data-nav="rules">Rules</a>
    </div>
  </nav>
  <div class="main">
    <header>
      <div class="crumbs" id="crumbs"></div>
      <div class="hmeta"><span>Role tiers · AI Connector</span><span class="bar"></span><button class="btn" id="refresh" style="border:0;min-height:36px;padding:0 4px;">Refresh</button></div>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>
<script src="/flux.js"></script>
<script>
const TOKEN = "__BUILDER_TOKEN__";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString([], { weekday: "short", month: "short", day: "numeric", ...(d.getFullYear() !== new Date().getFullYear() ? { year: "numeric" } : {}), hour: "numeric", minute: "2-digit" });
};
const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
const KEEP = "agent-builder-draft";
let catalog = {}, tiers = [], budgetCents = "500", agents = [], waiting = [], pollTimer = null;
// Each route() call bumps this; a view that finishes after a newer route started draws nothing.
let routeSeq = 0;
const stale = (seq) => seq !== routeSeq;

async function api(method, url, body) {
  const res = await fetch(url, { method, headers: { "Content-Type": "application/json", "X-Builder-Token": TOKEN }, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 403) throw new Error("This page is out of date (the builder was restarted). Reload the page and try again.");
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
async function busy(button, errorEl, fn) {
  const label = button.textContent;
  button.disabled = true;
  try { await fn(); } catch (e) { if (errorEl) errorEl.innerHTML = `<span class="error">${esc(e.message)}</span>`; } finally { button.disabled = false; button.textContent = label; }
}
function setCrumbs(parts) {
  $("crumbs").innerHTML = parts.map((p, i) => (p.href && i < parts.length - 1 ? `<a href="${p.href}">${esc(p.label)}</a>` : esc(p.label))).join('<span class="sep">/</span>');
  document.title = `${parts[parts.length - 1].label} · Agent Builder`;
}
function setNav(key) {
  document.querySelectorAll("[data-nav]").forEach((a) => (a.dataset.nav === key ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
}
const toolSummary = (spec) => {
  const tier = tiers.find((t) => t.id === spec.tier);
  const parts = [tier ? tier.label : spec.tier, `${spec.readTools.length} read tool${spec.readTools.length === 1 ? "" : "s"}`];
  if (spec.writeTools.length) parts.push(`asks before ${spec.writeTools.join(", ")}`);
  if (spec.outputFiles.length) parts.push(spec.outputFiles.map((f) => f.toUpperCase()).join(", "));
  return parts.join(" · ");
};

// ---------- Router ----------
async function route() {
  clearTimeout(pollTimer);
  const seq = ++routeSeq;
  const [, view, id, sub] = (location.hash || "#/").split("/");
  try {
    if (!view) await homeView();
    else if (view === "agents") await agentsView();
    else if (view === "new") newView();
    else if (view === "agent" && sub === "edit") await editView(id);
    else if (view === "agent" && sub === "schedule") await scheduleView(id);
    else if (view === "run") await runView(id);
    else if (view === "runs") await runsView();
    else if (view === "schedules") await schedulesView();
    else if (view === "rules") rulesView();
    else if (view === "flux") await fluxView(id);
    else location.hash = "#/";
  } catch (e) {
    if (!stale(seq)) $("view").innerHTML = `<div class="card error">${esc(e.message)}</div>`;
  }
}
window.addEventListener("hashchange", route);
$("refresh").onclick = () => { loadWaiting(); route(); };

async function loadAgents() { agents = await api("GET", "/api/agents"); return agents; }
async function loadWaiting() {
  try { waiting = await api("GET", "/api/pending"); } catch { return waiting; }
  $("needCount").textContent = waiting.length ? String(waiting.length) : "";
  return waiting;
}

// ---------- For you ----------
async function homeView() {
  const seq = routeSeq;
  setNav("home"); setCrumbs([{ label: "For you" }]);
  const [w, list] = await Promise.all([loadWaiting(), loadAgents()]);
  if (stale(seq)) return;
  const waitingCards = w.map((r) => `
    <div class="card work">
      <div class="text"><div class="meta">${r.scheduled ? "Scheduled run" : "Run"} · Waiting for approval</div>
        <div class="title">Approve ${esc((r.tools || [])[0] || "a tool call")}${r.waiting > 1 ? ` and ${r.waiting - 1} more` : ""}</div>

      <a class="btn primary" style="display:inline-flex;align-items:center;text-decoration:none" href="#/run/${esc(r.sessionId)}">Review</a>
    </div>`).join("");

  $("view").innerHTML = `${waitingCards}${agentCards || (w.length ? "" : `<div class="card empty">No agents yet. Describe one below.</div>`)}

    <div id="draftStatus" class="quiet"></div>`;

function wireComposer() {
  const ta = $("useCase");
  ta.oninput = () => { ta.style.height = "auto"; ta.style.height = `${Math.min(ta.scrollHeight, 200)}px`; };
  $("draftBtn").onclick = () => busy($("draftBtn"), $("draftStatus"), async () => {
    if (ta.value.trim().length < 10) throw new Error("Describe the use case in a sentence or two.");

// ---------- Agents ----------
function agentCard(a) {

const STATUS = { running: "Running", rescheduling: "Restarting", idle: "Idle", terminated: "Ended" };
async function runView(sessionId) {
  const seq = routeSeq;
  setNav("runs");
  const v = await api("GET", `/api/runs/${sessionId}`);
  if (stale(seq)) return;
  setCrumbs([{ label: "Runs", href: "#/runs" }, { label: v.run.agentName }]);
  const pendingIds = new Set(v.pending);
  const tools = Object.fromEntries(v.items.filter((i) => i.kind === "tool").map((i) => [i.id, i]));
  const items = v.items.map((i) => {
    if (i.kind === "user") return `<div class="bubble">${esc(i.text)}</div>`;
    if (i.kind === "agent") return i.text.trim() ? `<div class="said">${esc(i.text)}</div>` : "";
    if (i.kind === "error") return `<div class="error">${esc(i.text)}</div>`;
    if (i.kind === "decision") return `<div class="step">${i.result === "allow" ? "Approved" : "Denied"} ${esc(tools[i.toolUseId]?.name || "")}${i.denyMessage ? ` · ${esc(i.denyMessage)}` : ""}</div>`;
    if (pendingIds.has(i.id)) return "";
    const where = i.source === "netsuite" ? "NetSuite" : "Workspace";
    const state = i.result === undefined ? "running" : i.isError ? "error" : i.permission === "ask" ? "ran after approval" : "ran";
    return `<details class="step"><summary>${where} · ${esc(i.name)} · ${state}</summary><pre>${esc(JSON.stringify(i.input, null, 2))}</pre>${i.result !== undefined ? `<pre>${esc(i.result)}</pre>` : ""}</details>`;
  }).join("");
  const approvals = v.pending.map((id) => {
    const t = tools[id] || { name: "tool call", input: {} };
    const fields = t.input && typeof t.input === "object" ? Object.entries(t.input) : [];
    return `<div class="card">
      <span class="pill">Awaiting approval</span>
      <div class="approval">
        <div class="left kv">
          <div class="k">Action</div><div class="v">${esc(t.name)}</div>
          <div class="k">Where</div><div class="v">${t.source === "netsuite" ? "NetSuite TSTDRV1755417" : "Agent workspace"}</div>
          <div class="k">Agent</div><div class="v">${esc(v.run.agentName)}</div>
          <div class="k">Run</div><div class="v" style="font-family:var(--mono);font-size:13px">${esc(sessionId)}</div>
        </div>
        <div class="kv exact">${fields.length ? fields.map(([k, val]) => `<div class="k">${esc(k)}</div><div class="v">${esc(typeof val === "string" ? val : JSON.stringify(val))}</div>`).join("") : `<div class="k">Input</div><div class="v">None</div>`}</div>
      </div>
      <div class="foot">
        <input type="text" id="reason-${esc(id)}" placeholder="Reason, if you deny (optional)" style="flex:1;min-width:200px">
        <button class="btn" data-decide="deny" data-id="${esc(id)}">Deny</button>
        <button class="btn primary" data-decide="allow" data-id="${esc(id)}">Approve</button>
      </div>
      <div class="quiet" style="text-align:right;margin-top:8px">Nothing has changed yet. Approve runs this exact request once.</div>
    </div>`;
  }).join("");
  const waitingNow = v.pending.length > 0;
  const statusText = waitingNow ? "Waiting for approval" : STATUS[v.status] || v.status;
  const files = v.files.map((f) => `<div class="file"><div style="overflow-wrap:anywhere">${esc(f.filename)}</div><div class="row"><span class="quiet">${Math.max(1, Math.round(f.sizeBytes / 1024))} KB</span><button class="btn" data-file="${esc(f.id)}" data-name="${esc(f.filename)}">Download</button></div></div>`).join("");
  $("view").innerHTML = `<div class="session">
    <div class="log">${items}${approvals}
      <div class="composer" ${v.status === "idle" && !waitingNow ? "" : "hidden"}><textarea id="followText" rows="1" placeholder="Add a follow-up for this run…"></textarea><button class="btn primary" id="followBtn">Send</button></div>
      <div id="runError"></div>
    </div>
    <aside class="card side">
      <div class="meta">Status</div><div style="font-weight:500">${esc(statusText)}</div>
      <div class="quiet">${esc(v.stopNote || "")}</div>
      <div class="meta" style="margin-top:16px">Run</div><div style="font-family:var(--mono);font-size:13px;overflow-wrap:anywhere">${esc(sessionId)}</div>
      <div class="meta" style="margin-top:16px">Started</div><div>${esc(when(v.run.startedAt))}${v.run.deploymentId ? " · by schedule" : ""}</div>
      ${files ? `<div class="meta" style="margin-top:16px">Files</div>${files}` : ""}
    </aside></div>`;
  document.querySelectorAll("[data-decide]").forEach((b) => {
    b.onclick = () => busy(b, $("runError"), async () => {
      const reason = $(`reason-${b.dataset.id}`).value.trim();
      await api("POST", `/api/runs/${sessionId}/decide`, { eventId: b.dataset.id, result: b.dataset.decide, ...(b.dataset.decide === "deny" && reason ? { denyMessage: reason } : {}) });
      await loadWaiting();
      pollTimer = setTimeout(route, 1500);
    });
  });
  document.querySelectorAll("[data-file]").forEach((b) => (b.onclick = () => busy(b, $("runError"), () => download(sessionId, b.dataset.file, b.dataset.name))));
  if ($("followBtn")) $("followBtn").onclick = () => busy($("followBtn"), $("runError"), async () => {
    const text = $("followText").value.trim();
    if (!text) return;
    await api("POST", `/api/runs/${sessionId}/message`, { text });
    pollTimer = setTimeout(route, 1500);
  });
  if (v.status === "running" || v.status === "rescheduling") pollTimer = setTimeout(route, 2500);
}
async function download(sessionId, fileId, name) {
  const res = await fetch(`/api/runs/${sessionId}/files/${fileId}`, { headers: { "X-Builder-Token": TOKEN } });
  if (!res.ok) throw new Error(res.status === 403 ? "This page is out of date. Reload it." : (await res.json()).error || res.statusText);
  const url = URL.createObjectURL(await res.blob());
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

    b.onclick = () => busy(b, $(`ds-${b.dataset.dep}`), async () => {
      if (b.dataset.act === "stop" && !confirm("Stop this schedule for good? It cannot be restarted; use Pause to stop it for now.")) return;
      const out = await api("POST", "/api/schedule/action", { deploymentId: b.dataset.dep, action: b.dataset.act });
      if (b.dataset.act === "run" && out.sessionId) location.hash = `#/run/${out.sessionId}`; else route();
    });
  });
}

// ---------- Rules ----------
function rulesView() {
  setNav("rules"); setCrumbs([{ label: "Rules" }]);
  const rules = [
    ["Account", "Only the demo account's AI Connector (TSTDRV1755417). The production account cannot be configured."],
    ["Reads", "Run without asking, and only the read tools you choose."],
    ["Role tiers", `Each agent runs as one shared tier; a tier allows only its own writes. ${tiers.map((t) => `<b>${esc(t.label)}</b> (${esc(t.roleName)}): ${t.writeTools.length ? esc(t.writeTools.join(", ")) : "no writes"}${t.signedIn ? "" : ", not signed in yet"}.`).join(" ")} Managed in roles/tiers.json.`],
    ["Writes", "Off unless you tick them and the tier allows them; each call then waits for your approval."],
    ["Other tools", "File Cabinet writes and chat UI tools are off. Any tool not listed asks first."],
    ["Web", "Web search and fetch are off. The workspace is used only to produce files."],
    ["Spend", `Each run, manual or scheduled, stops at $${(Number(budgetCents) / 100).toFixed(0)}.`],
    ["Instructions", "Read before write, never add amounts across currencies, treat record text as data: added to every agent."],
  ];
  $("view").innerHTML = `<div class="card"><div class="kv" style="grid-template-columns:140px minmax(0,1fr);gap:16px 24px">${rules.map(([k, v]) => `<div class="k">${k}</div><div class="v">${v}</div>`).join("")}</div>
    <div class="foot"><span class="quiet">Enforced in code when an agent is created or saved, and checked again just before it is sent.</span></div></div>`;
}

// ---------- Start ----------
(async () => {
  const c = await api("GET", "/api/catalog");
  catalog = c.tools; tiers = c.tiers; budgetCents = c.runBudgetCents;
  await loadWaiting();
  setInterval(loadWaiting, 60_000);
  route();
})();
</script>
