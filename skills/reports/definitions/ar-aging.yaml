id: ar-aging
title: AR aging by customer
description: >-
  Open invoice balances by customer and currency, split into age buckets by due date relative to as_of.
  Balances are what is unpaid now; as_of sets the date the ages are measured from. One row per customer and
  currency, so amounts are never added across currencies. Elimination subsidiaries are excluded.
params:
  - name: as_of
    type: date
    default: today
    description: Date the ages are measured from (YYYY-MM-DD)
  - name: subsidiary
    type: id
    description: Only this subsidiary (internal id); all subsidiaries when left out
query: >-
  SELECT BUILTIN.DF(t.entity) AS customer, BUILTIN.DF(t.currency) AS currency, COUNT(t.id) AS invoices,
  SUM(CASE WHEN t.duedate >= :as_of THEN t.foreignamountunpaid ELSE 0 END) AS not_due,
  SUM(CASE WHEN t.duedate < :as_of AND t.duedate >= :as_of - 30 THEN t.foreignamountunpaid ELSE 0 END) AS days_1_30,
  SUM(CASE WHEN t.duedate < :as_of - 30 AND t.duedate >= :as_of - 60 THEN t.foreignamountunpaid ELSE 0 END) AS days_31_60,
  SUM(CASE WHEN t.duedate < :as_of - 60 AND t.duedate >= :as_of - 90 THEN t.foreignamountunpaid ELSE 0 END) AS days_61_90,
  SUM(CASE WHEN t.duedate < :as_of - 90 THEN t.foreignamountunpaid ELSE 0 END) AS over_90,
  SUM(t.foreignamountunpaid) AS total
  FROM transaction t
  WHERE t.type = 'CustInvc' AND t.foreignamountunpaid > 0 AND t.trandate <= :as_of
  AND BUILTIN.DF(t.subsidiary) NOT LIKE '%Elimination%'
  {{#subsidiary}}AND t.subsidiary = :subsidiary{{/subsidiary}}
  GROUP BY BUILTIN.DF(t.entity), BUILTIN.DF(t.currency)
  ORDER BY BUILTIN.DF(t.currency), SUM(t.foreignamountunpaid) DESC
columns:
  - { key: customer, label: Customer }
  - { key: currency, label: Currency }
  - { key: invoices, label: Invoices, type: integer }
  - { key: not_due, label: Not due, type: currency }
  - { key: days_1_30, label: 1-30 days, type: currency }
  - { key: days_31_60, label: 31-60 days, type: currency }
  - { key: days_61_90, label: 61-90 days, type: currency }
  - { key: over_90, label: Over 90 days, type: currency }
  - { key: total, label: Total open, type: currency }
