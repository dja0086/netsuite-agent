id: open-sales-orders
title: Open sales orders
description: >-
  Sales orders not yet billed or closed (status pending approval, pending fulfilment, partially fulfilled or
  pending billing), oldest first. In this account sales orders are labelled "Master Contract".
params:
  - name: subsidiary
    type: id
    description: Only this subsidiary (internal id); all subsidiaries when left out
query: >-
  SELECT t.id AS id, t.tranid AS order_number, BUILTIN.DF(t.entity) AS customer,
  TO_CHAR(t.trandate, 'YYYY-MM-DD') AS order_date, BUILTIN.DF(t.status) AS status,
  BUILTIN.DF(t.subsidiary) AS subsidiary, BUILTIN.DF(t.currency) AS currency, t.foreigntotal AS amount
  FROM transaction t
  WHERE t.type = 'SalesOrd' AND t.status IN ('A', 'B', 'D', 'E', 'F')
  {{#subsidiary}}AND t.subsidiary = :subsidiary{{/subsidiary}}
  ORDER BY t.trandate, t.id
columns:
  - { key: order_number, label: Order }
  - { key: customer, label: Customer }
  - { key: order_date, label: Date, type: date }
  - { key: status, label: Status }
  - { key: subsidiary, label: Subsidiary }
  - { key: currency, label: Currency }
  - { key: amount, label: Amount, type: currency }
