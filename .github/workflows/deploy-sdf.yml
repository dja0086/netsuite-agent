name: deploy-sdf

# Deploys the SuiteCloud project in netsuite/ to the one NetSuite account this project has: the demo account
# TSTDRV1755417, in GitHub environment "production". Owner decision 2026-10-25: one environment, one approval.
# The approval is GitHub's own environment review (required reviewer dja0086, protected branches only), which an
# edited workflow on a branch cannot skip. Setup checklist and rollback: docs/release.md ("SDF deploy pipeline").
#
# Every run deploys one commit: `ref` is resolved to a SHA that must be reachable from main, and the deploy job
# checks out that SHA, so main moving while the approval waits changes nothing.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to deploy; must be reachable from main
        required: true
        default: main
      validate_only:
        description: Server-validate without deploying
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time; a running deploy is never cancelled. GitHub keeps at most one run
# pending behind the running one (a newer dispatch replaces the pending run).
concurrency:
  group: deploy-sdf
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: resolve ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the ref and refuse anything not on main
        id: ref
        env:
          REF: ${{ inputs.ref }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (it was started from $WORKFLOW_REF)."
            exit 1
          fi
          if ! [[ "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::ref must be a branch, tag or commit SHA."
            exit 1
          fi
          sha=$(git rev-parse --verify --quiet "refs/remotes/origin/$REF^{commit}" \
            || git rev-parse --verify --quiet "refs/tags/$REF^{commit}" \
            || git rev-parse --verify --quiet "$REF^{commit}") || {
            echo "::error::ref '$REF' was not found."
            exit 1
          }
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "::error::$sha is not reachable from main. Merge the change through a PR first."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### deploy-sdf"
            echo "- ref: \`$REF\` -> \`$sha\`"
            echo "- mode: ${{ inputs.validate_only && 'validate only' || 'validate and deploy' }}"
            echo "- target: environment production = demo account TSTDRV1755417"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy (production = demo account)
    needs: resolve
    runs-on: ubuntu-latest
    # GitHub holds the job here until a required reviewer approves (Review deployments on the run page).
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      AUTH_ID: ns-agent-production
      ACCOUNT: ${{ vars.NS_PROD_ACCOUNT_ID }}
      SUITECLOUD_CI: "1"
    steps:
      # Pipeline tooling from the workflow's own commit; the SDF project from the resolved SHA.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: deploy
          persist-credentials: false
      - uses: ./.github/actions/suitecloud-setup
      - name: Authenticate with the M2M certificate (key written outside the workspace)
        working-directory: deploy/netsuite
        env:
          KEY: ${{ secrets.NS_PROD_SDF_PRIVATE_KEY }}
          CERT_ID: ${{ vars.NS_PROD_SDF_CERT_ID }}
        run: |
          for v in KEY ACCOUNT CERT_ID; do
            [ -n "${!v}" ] || { echo "::error::$v is empty: set it on the production environment (docs/release.md)."; exit 1; }
          done
          # CI mode stores the credentials encrypted with this passkey; it lives only for this job.
          passkey=$(openssl rand -hex 32)
          echo "::add-mask::$passkey"
          echo "SUITECLOUD_CI_PASSKEY=$passkey" >> "$GITHUB_ENV"
          export SUITECLOUD_CI_PASSKEY="$passkey"
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/sdf.pem"
          suitecloud account:setup:ci --account "$ACCOUNT" --authid "$AUTH_ID" \
            --certificateid "$CERT_ID" --privatekeypath "$RUNNER_TEMP/sdf.pem"
      - name: Pin the project to this auth ID and confirm the account
        working-directory: deploy/netsuite
        run: |
          # validate and deploy take no --authid in CLI 4.1.1; they use project.json's defaultAuthId.
          printf '{\n  "defaultAuthId": "%s"\n}\n' "$AUTH_ID" > project.json
          info=$(suitecloud account:manageauth --info "$AUTH_ID" | sed 's/\x1b\[[0-9;]*[A-Za-z]//g')
          grep -E '^(Authentication ID|Account ID|Role|Account Type):' <<<"$info" || true
          got=$(sed -n 's/^Account ID: *//p' <<<"$info")
          norm() { tr '[:lower:]-' '[:upper:]_' <<<"$1"; }
          if [ "$(norm "$got")" != "$(norm "$ACCOUNT")" ]; then
            echo "::error::Auth ID $AUTH_ID points at '$got', not NS_PROD_ACCOUNT_ID '$ACCOUNT'."
            exit 1
          fi
      - name: Validate on the server
        working-directory: deploy/netsuite
        run: |
          mkdir -p "$RUNNER_TEMP/sdf-logs"
          suitecloud project:validate --log "$RUNNER_TEMP/sdf-logs" | tee "$RUNNER_TEMP/sdf-logs/validate-output.txt"
      - name: Deploy
        if: ${{ !inputs.validate_only }}
        working-directory: deploy/netsuite
        run: suitecloud project:deploy --log "$RUNNER_TEMP/sdf-logs" | tee "$RUNNER_TEMP/sdf-logs/deploy-output.txt"
      - name: Upload deploy output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdf-production-${{ needs.resolve.outputs.sha }}
          path: ${{ runner.temp }}/sdf-logs/
          if-no-files-found: warn
          retention-days: 90
      - name: Delete the private key and stored credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sdf.pem" deploy/netsuite/project.json ~/.suitecloud-sdk/credentials_*.p12
