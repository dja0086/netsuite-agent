name: suitecloud-setup
description: Node 24 LTS, Temurin JDK 21 and the pinned SuiteCloud CLI (the toolchain that runs locally).

# One place for the versions: ci.yml (sdf-check) and deploy-sdf.yml (both stages) use this action.
# SuiteCloud CLI 4.1.1 supports Node 24 LTS and needs a JDK for its SDK jar, which its
# postinstall downloads from Oracle. SUITECLOUD_CLI_ACCEPT_LICENSE accepts the Oracle Free Use
# Terms for that download, as the CLI's README describes for CI installs.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - name: Install SuiteCloud CLI 4.1.1
      shell: bash
      env:
        SUITECLOUD_CLI_ACCEPT_LICENSE: "true"
      run: |
        npm install -g @oracle/suitecloud-cli@4.1.1
        suitecloud --version
